<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f6f3ff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0a1a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="proGress360">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="proGress360 by Guille · seguimiento personal de musculación">
<title>proGress360</title><meta name="author" content="Guille">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{
  --bg:#f3f4f6;--card:#ffffff;--card2:#f7f8fa;--text:#111418;--muted:#6b7280;--line:#e4e6ea;
  --accent:#2457d6;--accent-ink:#ffffff;--accent-soft:#e8eefc;--accent2:#0f8a7e;
  --ok:#15803d;--ok-soft:#e7f5ec;--warn:#b45309;--warn-soft:#fdf3e4;--danger:#c62828;--danger-soft:#fdecec;
  --radius:16px;--tab-h:62px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0f12;--card:#16191e;--card2:#1c2026;--text:#e9ebee;--muted:#9aa1ab;--line:#272b32;
  --accent:#5b8cff;--accent-ink:#0b1020;--accent-soft:#1b2640;--accent2:#35c2b2;
  --ok:#4ade80;--ok-soft:#12261a;--warn:#f5b45a;--warn-soft:#2a2012;--danger:#ff6b6b;--danger-soft:#2c1515;}}
:root[data-theme=dark]{
  --bg:#0d0f12;--card:#16191e;--card2:#1c2026;--text:#e9ebee;--muted:#9aa1ab;--line:#272b32;
  --accent:#5b8cff;--accent-ink:#0b1020;--accent-soft:#1b2640;--accent2:#35c2b2;
  --ok:#4ade80;--ok-soft:#12261a;--warn:#f5b45a;--warn-soft:#2a2012;--danger:#ff6b6b;--danger-soft:#2c1515;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{resize:vertical;margin:8px 0}
svg{width:22px;height:22px;flex:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:17px}
p{margin:6px 0}
small{font-size:12.5px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}.center{text-align:center}.pad{padding:0 4px}
.danger-text{color:var(--danger)!important}
#view{padding:calc(var(--safe-t) + 6px) 16px calc(var(--tab-h) + var(--safe-b) + 24px);max-width:640px;margin:0 auto}
body.has-timer #view{padding-bottom:calc(var(--tab-h) + var(--safe-b) + 92px)}

/* header */
.hdr{padding:10px 2px 10px}
.hdr h1{font-size:32px;font-weight:750;letter-spacing:-.02em}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr-sub{color:var(--muted);margin:2px 0 0;font-size:14.5px}
.hdr-back{display:flex;align-items:center;gap:2px;color:var(--accent);margin:0 0 6px -6px;min-height:40px}

/* cards */
.card{display:block;width:100%;text-align:left;background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;border:1px solid var(--line)}
.card h3{margin-bottom:6px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.card-head h3{display:flex;align-items:center;gap:8px;margin:0}
.hero h2{font-size:22px;margin:4px 0 6px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin:4px 0 14px}
.meta span{display:flex;align-items:center;gap:4px}.meta svg{width:16px;height:16px}
.ok-line{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}.ok-line svg{width:20px;height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.grid2 .card{margin:0}
.span2{grid-column:span 2}
.mini{padding:14px}
.mini-title{font-weight:600;margin:4px 0 2px}
.big-num{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.big-num small{font-size:15px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px;margin:4px 0}.dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--accent)}
.progline{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}
.progline div{height:100%;background:var(--accent);border-radius:3px}
ul.plain{margin:6px 0;padding-left:18px}ul.plain li{margin:3px 0}
ol.exlist{margin:6px 0 14px;padding-left:20px;font-size:14.5px}ol.exlist li{margin:3px 0}
.routine.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:18px 8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;width:100%;text-align:center}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px;width:auto}
.btn.big{min-height:54px;font-size:17px}
.btn.huge{min-height:66px;font-size:19px;border-radius:18px}
.btn.huge svg{width:28px;height:28px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn:active,.st-btn:active,.chip:active,.act:active{transform:scale(.97);opacity:.85}
.btn.flash{background:var(--ok)!important;color:#fff!important;transform:scale(1.02);transition:all .15s}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.link{color:var(--accent);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:4px;min-height:36px}
.link svg{width:17px;height:17px}
.link.strong{font-size:16px;color:var(--text);text-align:left}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--muted)}
.icon-btn:disabled{opacity:.3}
.file-btn{position:relative;overflow:hidden;margin-top:12px}
.file-btn input{position:absolute;inset:0;opacity:0;width:100%}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{min-height:40px;min-width:44px;padding:6px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.chips.scale.s11{grid-template-columns:repeat(11,1fr)}
.chips.scale .chip{min-width:0;padding:6px 0;font-size:14px}

/* stepper */
.stepper{display:flex;align-items:stretch;gap:6px}
.st-btn{min-width:52px;min-height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:650;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.st-btn svg{width:18px;height:18px}
.st-val{min-width:84px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:3px;font-weight:650;font-variant-numeric:tabular-nums}
.st-val .unset,.unset{color:var(--muted);font-weight:500}
.logrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.logrow>div:first-child{display:flex;flex-direction:column;min-width:0}
.logrow small{color:var(--muted)}
.logblock{padding:10px 0;border-bottom:1px solid var(--line)}
.logblock:last-child,.logrow:last-child{border-bottom:0}
.mm{display:flex;align-items:center;gap:4px}.mm .st-btn{min-width:38px}.mm .st-val{min-width:30px}
input.date{width:auto;padding:8px 10px}

/* alerts */
.alerts{margin:12px 0}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin:8px 0;background:var(--accent-soft)}
.alert p{margin:0;flex:1;font-size:14.5px}
.alert svg{margin-top:1px;color:var(--accent)}
.alert.warn{background:var(--warn-soft)}.alert.warn svg{color:var(--warn)}
.alert.good{background:var(--ok-soft)}.alert.good svg{color:var(--ok)}
.alert .link{white-space:nowrap;min-height:auto}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 4px calc(var(--safe-b) + 2px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tab-h);color:var(--muted);font-size:11px;font-weight:600;position:relative;max-width:120px}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}

/* timer */
#timerbar{position:fixed;left:10px;right:10px;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);z-index:25;display:none;border-radius:18px;background:var(--text);color:var(--bg);overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:620px;margin:0 auto}
#timerbar.on{display:block}
#timerbar.done{background:var(--ok);color:#fff;animation:pulse 1s ease-in-out 4}
@keyframes pulse{50%{transform:scale(1.03)}}
.tb-prog{position:absolute;left:0;top:0;bottom:0;background:rgba(127,127,127,.25);transition:width .25s linear}
.tb-row{position:relative;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;min-height:64px}
.tb-main{flex:1;display:flex;flex-direction:column;min-width:0}
.tb-time{font-size:26px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.tb-label{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{min-width:50px;min-height:48px;border-radius:12px;background:rgba(127,127,127,.25);font-weight:700;display:flex;align-items:center;justify-content:center}
.tb-btn.wide{padding:0 22px;background:rgba(255,255,255,.25)}
.tb-btn svg{width:20px;height:20px}

/* session */
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 6px}
.sess-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sess-top .btn svg{width:16px;height:16px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.strip-i{flex:none;width:118px;text-align:left;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:1px;scroll-snap-align:start}
.strip-i b{font-size:12px;color:var(--muted)}
.strip-i span{font-size:13px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.strip-i small{color:var(--muted)}
.strip-i.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.strip-i.full{background:var(--ok-soft)}.strip-i.full small{color:var(--ok);font-weight:600}
.strip-i.skip{opacity:.5}
.ex-card{padding:14px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ex-ico svg{width:26px;height:26px}
.ex-titles h2{font-size:19px;line-height:1.2}
.ex-mus{font-size:13.5px;margin-top:3px}
.ex-target{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:10px 0 4px;font-size:15px}
.cue{background:var(--card2);border-radius:10px;padding:10px 12px;font-size:14px;margin:6px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats3>div{background:var(--card2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.stats3 small{color:var(--muted);font-size:11.5px}
.stats3 b{font-size:14.5px;line-height:1.25;word-break:break-word}
.sugg{background:var(--accent-soft);border-radius:var(--radius);padding:14px;margin:12px 0}
.sugg.warn{background:var(--warn-soft)}
.sugg-t{display:flex;gap:8px;align-items:flex-start}.sugg-t svg{color:var(--accent);margin-top:1px}
.sugg p{font-size:14.5px;margin:6px 0 0}
.sugg .row2{margin-bottom:0}
.editor{padding:14px}
.editor.editing{border-color:var(--warn)}
.ed-label{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.ed-label b{font-size:16px;margin-right:auto}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed-col{display:flex;flex-direction:column;gap:4px}
.ed-col>small,.ed-row>small{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.ed-col .stepper{flex-direction:column;gap:6px}
.ed-col .st-val{flex-direction:column;gap:0;min-height:56px;background:var(--card2);border-radius:12px;line-height:1}
.ed-col .st-val .v{font-size:30px;font-weight:750}
.ed-col .st-val small{color:var(--muted);font-size:12px;margin-top:2px}
.ed-col .stepper{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"v v" "m p"}
.ed-col .st-val{grid-area:v}.ed-col .st-btn[data-dir="-1"]{grid-area:m}.ed-col .st-btn[data-dir="1"]{grid-area:p}
.ed-col .st-btn{min-height:52px;font-size:16px}
.ed-row{margin-top:10px}
.ed-row .chips{padding-top:4px}
.ed-row .chip{flex:1}
.editor .btn.huge{margin-top:14px}
.sets{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.set-row{display:grid;grid-template-columns:28px 48px 1fr auto 26px;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;min-height:48px;font-variant-numeric:tabular-nums}
.set-row .sn{font-weight:700;color:var(--muted)}.set-row .st{font-size:12px;color:var(--muted)}.set-row .sw{font-weight:600}.set-row .sr{font-size:13px;color:var(--muted)}
.set-row .sc svg{color:var(--ok)}
.set-row.done{background:var(--ok-soft)}
.set-row.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:68px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:center;padding:6px}
.act svg{color:var(--accent)}

/* sheets */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.on{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 18px calc(var(--safe-b) + 22px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-title{font-size:21px;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.num-input{display:flex;align-items:center;gap:8px;margin:10px 0 14px}
.num-input input{font-size:32px;font-weight:700;text-align:center;padding:14px}
.num-input span{font-size:18px;color:var(--muted)}
.search{margin:6px 0 4px}
h4.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.hist-ex{padding:8px 0;border-bottom:1px solid var(--line)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.daynav b{font-size:15px}
.photo-big{width:100%;border-radius:14px;margin:6px 0 12px}

/* list rows */
.list{padding:4px 0}
.list.card{padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row-main{flex:1;display:flex;flex-direction:column;min-width:0}
.row-main small{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row>svg{color:var(--muted);width:18px;height:18px}
.row-ico{color:var(--accent);display:flex}
.toggle-row{border-bottom:1px solid var(--line)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.switch.on{background:var(--ok)}.switch.on i{left:22px}

/* progress */
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:4px 0 8px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.small button{min-height:34px}
.cards{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr;gap:0 12px}}
.excard .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.excard .kv span{color:var(--muted)}
.excard .kv b{text-align:right}
.up{color:var(--ok)}.down{color:var(--danger)}.flat{color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin:6px 0 0;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .band{fill:var(--accent-soft)}
.chart .col{fill:var(--accent);opacity:.55}.chart .colhi{fill:var(--accent)}
.chart .tline{stroke:var(--text);stroke-width:1.5;stroke-dasharray:3 2;opacity:.6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.vbar{padding:8px 0}
.vb-head{display:flex;align-items:baseline;gap:6px;font-size:14.5px}.vb-head span{flex:1}
.vb-track{position:relative;height:12px;background:var(--card2);border-radius:6px;margin:5px 0 3px;overflow:hidden}
.vb-band{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:2px solid var(--accent);border-right:2px solid var(--accent);opacity:.9}
.vb-fill{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--accent)}
.vb-fill.low,.vb-fill.high{background:var(--warn)}
.vb-plan{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.45}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.ph{display:flex;flex-direction:column;gap:3px}
.ph img,.ph-empty{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--card2)}
.ph-empty{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ph small{font-size:11px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--card2)}

/* calendar */
.cycle{display:flex;gap:4px;margin-bottom:2px}
.cyc-b{background:var(--card2);border-radius:8px;padding:4px 6px;text-align:center;color:var(--muted)}
.cyc-b.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.week{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.day{display:flex;align-items:center;gap:12px;padding:10px 6px 10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:62px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .05s}
.day.today{border-color:var(--accent)}
.day-d{display:flex;flex-direction:column;align-items:center;width:28px}
.day-d b{font-size:15px}.day-d small{color:var(--muted)}
.day-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--muted)}
.kind-workout .day-ico{background:var(--accent-soft);color:var(--accent)}
.kind-swim .day-ico{background:color-mix(in srgb,var(--accent2) 15%,transparent);color:var(--accent2)}
.day-main{flex:1;display:flex;flex-direction:column;min-width:0}
.day-main>span{font-weight:600;font-size:15px}
.st{font-size:12.5px;display:flex;align-items:center;gap:4px}.st svg{width:14px;height:14px}
.st.ok{color:var(--ok)}.st.miss{color:var(--danger)}
.drag{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab}
.day.dragging{position:relative;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:.95}
.day.over{border-color:var(--accent);background:var(--accent-soft)}
.day.moving{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.day.target{border-style:dashed}
.wkgrid{display:flex;flex-direction:column;gap:4px}
.wk{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;align-items:center;padding:3px 4px;border-radius:8px}
.wk.cur{background:var(--accent-soft)}
.wk span{font-size:12px;font-weight:600;color:var(--muted);text-align:left}
.wk i,.lg{display:block;height:14px;border-radius:4px;background:var(--card2);border:1px solid var(--line)}
.lg{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px}
.wk i.done,.lg.done{background:var(--ok);border-color:transparent}
.wk i.plan,.lg.plan{border-color:var(--accent);background:var(--accent-soft)}
.wk i.swim,.lg.swim{border-color:var(--accent2)}
.wk i.miss,.lg.miss{background:var(--danger-soft);border-color:var(--danger)}

/* settings */
.rt-item.ss{border-left:4px solid var(--accent)}
.rt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.rt-grid>div{display:flex;flex-direction:column;gap:3px}
.rt-grid small{color:var(--muted)}
.rt-grid .stepper{gap:3px}.rt-grid .st-btn{min-width:34px;padding:0 4px}.rt-grid .st-val{min-width:26px}
.rt-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rt-actions .chip{font-size:13px}
ol.steps{padding-left:20px}ol.steps li{margin:8px 0}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-150%);z-index:60;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14.5px;font-weight:500;max-width:min(92vw,560px);transition:transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.2)}
#toast.on{transform:translate(-50%,0)}

@media (max-width:360px){
  #view{padding-left:12px;padding-right:12px}
  .hdr h1{font-size:28px}
  .stats3 b{font-size:13px}
  .chips.scale .chip{font-size:13px;min-height:38px}
  .st-btn{min-width:46px}
  .act{font-size:11.5px}
}

/* sesión compacta */
.sess-top{padding:6px 0 4px}
.sess-l{min-width:0}.sess-l .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip{padding-top:2px;padding-bottom:4px}
.strip-i{width:auto;max-width:190px;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;min-height:42px}
.strip-i span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;-webkit-line-clamp:unset}
.strip-i small{flex:none;font-weight:600}
.editor{padding:12px 14px;margin-top:8px}
.ed-head{display:flex;gap:10px;align-items:center}
.ex-ico.sm{width:38px;height:38px;border-radius:10px}.ex-ico.sm svg{width:22px;height:22px}
.ed-titles{min-width:0}
.ed-titles h2{font-size:18px;line-height:1.2}
.ed-sub{font-size:13.5px;color:var(--muted);margin-top:1px}.ed-sub b{color:var(--text)}
.ed-prev{font-size:13.5px;color:var(--muted);margin:8px 0 8px;padding:7px 10px;background:var(--card2);border-radius:10px}
.ed-prev b{color:var(--text)}
.ed-col .stepper{display:flex;flex-direction:row;gap:4px}
.ed-col .st-val{flex:1;min-width:0;min-height:58px;background:transparent}
.ed-col .st-val .v{font-size:28px}
.ed-col .st-btn{min-width:44px;min-height:58px;padding:0;flex:none}
.ed-col .st-btn svg{width:20px;height:20px}
.ed-row{margin-top:8px;display:flex;align-items:center;gap:10px}
.ed-row .chips{flex:1;padding:0}
.ed-row .chip{min-height:44px}
.editor .btn.huge{margin-top:10px}
.ed-tools{display:flex;justify-content:space-between;gap:6px;margin-top:4px;flex-wrap:wrap}
.ed-tools .link{min-height:40px}
.ex-card .stats3{margin-top:8px}
@media (max-width:380px){.ed-grid{gap:6px}.ed-col .st-btn{min-width:40px}.ed-col .st-val .v{font-size:25px}}

.chips:not(.scale) .chip{flex:none}
.ed-row .chips .chip{flex:1}
/* v2: barra/mancuerna y nota de peso */
.varbox{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:var(--accent-soft,rgba(10,132,255,.1));margin:6px 0}
.varbox small{color:var(--muted)}
.varbox .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.varlink{display:inline-flex;align-items:center;gap:4px;margin:2px 0 4px;font-size:13px}
.varlink svg{width:14px;height:14px}
.link.tiny{font-size:12px;margin-top:4px;opacity:.85}
.wnote{display:flex;gap:6px;align-items:flex-start;margin-top:8px}
.wnote svg{width:14px;height:14px;flex:none;margin-top:2px}

/* =====================================================================
   v3 · Tema «Neón nocturno» (oscuro) + «Aurora clara» (claro)
   Rosa #FF2E93 · Violeta #8B5CF6 · Púrpura #A21CAF · Azul eléctrico #2979FF
   ===================================================================== */
:root{
  --pink:#ff2e93;--violet:#8b5cf6;--purple:#a21caf;--blue:#2979ff;
  --grad:linear-gradient(100deg,#ff2e93 0%,#a21caf 40%,#8b5cf6 65%,#2979ff 100%);
  --grad-btn:linear-gradient(95deg,#ff2e93 0%,#8b5cf6 55%,#2979ff 100%);
  --bg:#f6f3ff;--card:#ffffff;--card2:#f3effd;--text:#1a1530;--muted:#6e6890;--line:#e8e2fa;
  --accent:#7c3aed;--accent-ink:#ffffff;--accent-soft:#f1eafe;--accent2:#2979ff;
  --ok:#0f9f6e;--ok-soft:#e5f7ef;
  --glow:0 6px 22px rgba(139,92,246,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0a1a;--card:#16142b;--card2:#1e1b38;--text:#f1eefe;--muted:#a49fc7;--line:#2b2750;
  --accent:#ff4fa7;--accent-ink:#ffffff;--accent-soft:#2a1838;--accent2:#4d8dff;
  --ok:#3ee6a4;--ok-soft:#10291f;--glow:0 6px 26px rgba(255,46,147,.35);}}
:root[data-theme=dark]{
  --bg:#0b0a1a;--card:#16142b;--card2:#1e1b38;--text:#f1eefe;--muted:#a49fc7;--line:#2b2750;
  --accent:#ff4fa7;--accent-ink:#ffffff;--accent-soft:#2a1838;--accent2:#4d8dff;
  --ok:#3ee6a4;--ok-soft:#10291f;--glow:0 6px 26px rgba(255,46,147,.35);}

/* fondo con halo de color */
body{background:
  radial-gradient(120% 50% at 0% 0%,color-mix(in srgb,var(--pink) 14%,transparent),transparent 60%),
  radial-gradient(90% 45% at 100% 8%,color-mix(in srgb,var(--blue) 14%,transparent),transparent 60%),var(--bg);
  background-attachment:fixed}
.card{border-radius:20px;box-shadow:0 2px 14px rgba(60,30,120,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:none}}
:root[data-theme=dark] .card{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:none}
.hdr h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* tarjeta principal en degradado */
.card.hero{background:var(--grad);color:#fff;border:0;box-shadow:var(--glow);position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.card.hero .eyebrow,.card.hero .muted,.card.hero .meta{color:rgba(255,255,255,.85)}
.card.hero .btn.primary{background:#fff;color:#6d28d9;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.card.hero .btn:not(.primary){background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.card.hero .exlist{color:#fff}
.card.hero .link{color:#fff}

/* botones */
.btn{border-radius:16px}
.btn.primary{background:var(--grad-btn);color:#fff;box-shadow:var(--glow)}
.btn.huge{border-radius:22px;min-height:70px;font-weight:700;letter-spacing:.01em}
.routine.today{border-color:transparent;box-shadow:0 0 0 2px var(--violet) inset,var(--glow)}

/* selección, pestañas, progreso */
.chip.on{background:var(--pink);color:#fff;box-shadow:0 3px 12px rgba(255,46,147,.35)}
.tab.on{color:var(--pink)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(255,46,147,.55))}
.progline div,.dots i.on{background:var(--grad-btn)}
.strip-i.on{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}
.sugg{background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 12%,var(--card)),color-mix(in srgb,var(--blue) 12%,var(--card)));border:1px solid color-mix(in srgb,var(--violet) 30%,transparent)}
.sugg-t svg{color:var(--pink)}
.link{color:var(--accent)}
.varbox{background:color-mix(in srgb,var(--violet) 12%,var(--card))}

/* editor de series: número grande (idea de «Electric sport») */
.st-val .v{font-size:30px;font-weight:800;letter-spacing:-.02em}
.st-btn{border-radius:50%;min-width:52px;width:52px;height:52px;min-height:52px;padding:0}
.ed-col .st-btn:last-child{background:var(--grad-btn);color:#fff;border:0}
.ed-col .st-btn:first-child{background:color-mix(in srgb,var(--violet) 18%,var(--card2));border:0}

/* temporizador azul eléctrico */
#timerbar{background:linear-gradient(95deg,#1f2bff 0%,#2979ff 60%,#8b5cf6 100%);color:#fff;box-shadow:0 10px 34px rgba(41,121,255,.45)}
#timerbar.done{background:var(--grad-btn)}
.tb-prog{background:rgba(255,255,255,.18)}
.tb-btn{background:rgba(255,255,255,.18);color:#fff}

/* gráficos de barras */
.col{fill:var(--violet);opacity:.55}.colhi{fill:url(#p90bar)}
:root .card.hero,:root:not([data-theme=light]) .card.hero,:root[data-theme=dark] .card.hero{background:var(--grad);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:var(--glow)}
/* branding discreto */
.brand{text-align:center;font-size:11px;letter-spacing:.04em;color:var(--muted);opacity:.7;margin:4px 0 10px;font-weight:600}
.brand b{background:var(--grad-btn);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.brand span{font-weight:500;font-style:italic}
.brand.left{text-align:left;margin:-2px 0 10px}
/* marca superior derecha: dos renglones de igual anchura */
.badge{display:flex;align-items:center;flex:none;opacity:.85;pointer-events:none;margin-left:auto}
.badge svg{width:155.25px;height:23.625px;overflow:visible} /* v9.1: otro 50 % más grande */
.badge .b1{font:800 12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:var(--text);letter-spacing:.01em}
.badge .b360{fill:url(#bdg)}
.badge .bG{fill:url(#bdgG)}
.badge .b2{font:italic 500 8px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;fill:var(--muted)}

/* =====================================================================
   Modo Sport («Electric sport»): color sólido, alto contraste, números grandes
   ===================================================================== */
:root[data-theme=sport]{
  --bg:#111018;--card:#1b1a26;--card2:#252334;--text:#ffffff;--muted:#a9a6c4;--line:#2e2c42;
  --accent:#2563ff;--accent-ink:#fff;--accent-soft:#1a2550;--accent2:#ff2d87;
  --pink:#ff2d87;--blue:#2563ff;--purple:#6d28d9;--violet:#8b5cf6;
  --grad:#2563ff;--grad-btn:#ff2d87;--glow:none;
  --ok:#3ee6a4;--ok-soft:#10291f;--warn:#ffb84d;--warn-soft:#2c2010;--danger:#ff5a6e;--danger-soft:#2c1418;
  color-scheme:dark;
}
:root[data-theme=sport] body{background:#111018}
:root[data-theme=sport] .card{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--line);border-radius:22px}
:root[data-theme=sport] .hdr h1{background:none;color:#fff;-webkit-background-clip:border-box;background-clip:border-box;font-weight:900;font-size:36px}
:root[data-theme=sport] .card.hero{background:#2563ff;box-shadow:none}
:root[data-theme=sport] .card.hero::after{display:none}
:root[data-theme=sport] .card.hero .btn.primary{background:#fff;color:#111018}
:root[data-theme=sport] .btn.primary{background:#ff2d87;box-shadow:none}
:root[data-theme=sport] .btn.huge{background:#fff;color:#111018;font-weight:800}
:root[data-theme=sport] .editor{background:#ff2d87;border-color:transparent;color:#fff}
:root[data-theme=sport] .editor small,:root[data-theme=sport] .editor .ed-sub,:root[data-theme=sport] .editor .muted{color:rgba(255,255,255,.85)}
:root[data-theme=sport] .editor .ed-prev,:root[data-theme=sport] .editor .varbox{background:rgba(0,0,0,.18);color:#fff}
:root[data-theme=sport] .editor .link{color:#fff}
:root[data-theme=sport] .editor .st-val .v{font-size:40px;font-weight:900}
:root[data-theme=sport] .editor .st-btn{background:#fff!important;color:#111018!important;border:0}
:root[data-theme=sport] .editor .chip{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:#fff}
:root[data-theme=sport] .editor .chip.on{background:#fff;color:#ff2d87;box-shadow:none}
:root[data-theme=sport] .editor .btn.primary{background:#fff;color:#ff2d87}
:root[data-theme=sport] .editor .btn:not(.primary){background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.4);color:#fff}
:root[data-theme=sport] .editor .ex-ico{background:rgba(255,255,255,.2);color:#fff}
:root[data-theme=sport] .chip.on{background:#2563ff;box-shadow:none}
:root[data-theme=sport] .tab.on{color:#2563ff}
:root[data-theme=sport] .tab.on svg{filter:none}
:root[data-theme=sport] .sugg{background:#6d28d9;border:0;color:#fff}
:root[data-theme=sport] .sugg p,:root[data-theme=sport] .sugg-t svg{color:#fff}
:root[data-theme=sport] #timerbar{background:#2563ff;box-shadow:none}
:root[data-theme=sport] #timerbar.done{background:#ff2d87}
:root[data-theme=sport] .progline div,:root[data-theme=sport] .dots i.on{background:#ff2d87}
:root[data-theme=sport] .brand b{background:none;color:#ff2d87;-webkit-text-fill-color:#ff2d87}
:root[data-theme=sport] .col{fill:#2563ff;opacity:1}
:root[data-theme=sport] .colhi{fill:#ff2d87}
:root[data-theme=sport] .chart rect[fill^="url"]{fill:#2563ff}
:root[data-theme=sport] .chart .ax{fill:var(--muted)}

/* ondas de color en el fondo del modo oscuro (eco de la cabecera «Aurora» del modo claro) */
.waves{position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20400%20800%22%20preserveAspectRatio%3D%22none%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22a%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ff2e93%22/%3E%3Cstop%20offset%3D%22.45%22%20stop-color%3D%22%23a21caf%22/%3E%3Cstop%20offset%3D%22.75%22%20stop-color%3D%22%238b5cf6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232979ff%22/%3E%3C/linearGradient%3E%20%3ClinearGradient%20id%3D%22b%22%20x1%3D%221%22%20x2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232979ff%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%238b5cf6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff2e93%22/%3E%3C/linearGradient%3E%20%3Cfilter%20id%3D%22f%22%3E%3CfeGaussianBlur%20stdDeviation%3D%2214%22/%3E%3C/filter%3E%3C/defs%3E%20%3Cg%20filter%3D%22url%28%23f%29%22%3E%20%3Cpath%20d%3D%22M-40%2070%20C%2060%2010%2C%20160%20150%2C%20260%2080%20S%20420%2040%2C%20460%2090%20L%20460%20190%20C%20360%20140%2C%20280%20230%2C%20170%20190%20S%2020%20150%2C%20-40%20200%20Z%22%20fill%3D%22url%28%23a%29%22%20opacity%3D%22.55%22/%3E%20%3Cpath%20d%3D%22M-40%20230%20C%2080%20180%2C%20180%20300%2C%20300%20240%20S%20430%20210%2C%20460%20250%20L%20460%20300%20C%20340%20270%2C%20250%20340%2C%20130%20300%20S%200%20270%2C%20-40%20300%20Z%22%20fill%3D%22url%28%23b%29%22%20opacity%3D%22.35%22/%3E%20%3Cpath%20d%3D%22M-40%20640%20C%2070%20590%2C%20190%20700%2C%20300%20650%20S%20430%20610%2C%20460%20650%20L%20460%20840%20L%20-40%20840%20Z%22%20fill%3D%22url%28%23b%29%22%20opacity%3D%22.30%22/%3E%20%3C/g%3E%3C/svg%3E") top center/100% 100% no-repeat;display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=sport]) .waves{display:block}}
:root[data-theme=dark] .waves{display:block}
body{isolation:isolate}

/* =====================================================================
   v7 · Cabecera con ondas definidas (concepto «Aurora clara»), también en oscuro
   ===================================================================== */

.hdr{padding-bottom:30px}
.hdr h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;text-shadow:0 2px 14px rgba(80,20,120,.25)}
.hdr .hdr-sub{color:rgba(255,255,255,.9)}
.hdr .hdr-back{color:#fff}
.hdr .hdr-row .btn,.hdr .hdr-row .link,.hdr .hdr-row .icon-btn{color:#fff}
.hdr .badge .b1{fill:#fff}
.hdr .badge .b2{fill:rgba(255,255,255,.85)}
.hdr .badge .b360{fill:url(#bdgL)}
.hdr .badge .bG{fill:url(#bdgGL)}
.badge{opacity:1}
/* el halo radial ya no es necesario en claro: lo sustituye la cabecera */
:root:not([data-theme=dark]):not([data-theme=sport]) body{background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme]) body{background:var(--bg)}}
:root[data-theme=dark] body{background:var(--bg)}

/* =====================================================================
   Sport: botones más grandes, menos texto y detalles
   ===================================================================== */
:root[data-theme=sport] .hdr::before{display:none}
:root[data-theme=sport] .hdr{padding-bottom:10px}
:root[data-theme=sport] .hdr h1{text-shadow:none}
:root[data-theme=sport] .hdr .badge .b1{fill:#fff}
:root[data-theme=sport] .hdr .badge .b360,:root[data-theme=sport] .hdr .badge .bG{fill:#ff2d87}
:root[data-theme=sport] .hdr-sub,
:root[data-theme=sport] .eyebrow,
:root[data-theme=sport] .meta,
:root[data-theme=sport] ol.exlist,
:root[data-theme=sport] .disclaimer,
:root[data-theme=sport] .brand,
:root[data-theme=sport] p.tiny,
:root[data-theme=sport] p.small.muted,
:root[data-theme=sport] .logrow small,
:root[data-theme=sport] .row-main small,
:root[data-theme=sport] .wnote,
:root[data-theme=sport] .ex-card,
:root[data-theme=sport] .cue,
:root[data-theme=sport] .ed-sub .tag,
:root[data-theme=sport] .legend,
:root[data-theme=sport] .tab span{display:none!important}
:root[data-theme=sport] .btn{min-height:60px;font-size:18px;border-radius:20px;font-weight:750}
:root[data-theme=sport] .btn.big{min-height:68px;font-size:20px}
:root[data-theme=sport] .btn.huge{min-height:88px;font-size:24px;border-radius:26px}
:root[data-theme=sport] .btn.huge svg{width:34px;height:34px}
:root[data-theme=sport] .btn.small{min-height:48px;font-size:16px}
:root[data-theme=sport] .st-btn{width:64px;height:64px;min-width:64px;min-height:64px}
:root[data-theme=sport] .st-btn svg{width:26px;height:26px}
:root[data-theme=sport] .chip{min-height:52px;min-width:52px;font-size:18px;border-radius:16px}
:root[data-theme=sport] .chips.scale .chip{min-height:46px;font-size:16px}
:root[data-theme=sport] .act{min-height:64px}
:root[data-theme=sport] .act span{font-size:13px}
:root[data-theme=sport] .set-row{min-height:58px;font-size:18px}
:root[data-theme=sport] .tab svg{width:30px;height:30px}
:root[data-theme=sport] .tb-time{font-size:34px}
:root[data-theme=sport] .tb-btn{min-width:60px;min-height:56px}
:root[data-theme=sport] .card h3{font-size:19px}
:root[data-theme=sport] .big-num{font-size:40px}
:root[data-theme=sport] .ed-tools .link{font-size:16px;min-height:44px}
:root[data-theme=sport] .ed-grid{grid-template-columns:1fr;gap:6px}
:root[data-theme=sport] .ed-col .stepper{justify-content:space-between}
:root[data-theme=sport] .ed-col .st-val{flex:1}
:root[data-theme=sport] .ed-prev{display:none}
:root[data-theme=sport] .chips{gap:8px}
:root[data-theme=sport] .editor .chips .chip{flex:1;min-width:0}

.flame .flame-svg{width:16px;height:20px}.flame.zero{opacity:.7}.flame.bump{animation:bump .7s}
@keyframes bump{30%{transform:scale(1.45)}60%{transform:scale(.92)}}
:root[data-theme=sport] .flame{background:#ff2d87;color:#fff;-webkit-text-fill-color:#fff;box-shadow:none}
.greet{margin:8px 2px 4px;display:flex;flex-direction:column;gap:2px}.greet b{font-size:20px}.greet span{color:var(--muted);font-size:15px}
:root[data-theme=sport] .greet span{display:none}
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}
.celebrate{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(15,10,40,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s;padding:24px}
.celebrate.on{opacity:1}.cel-in{text-align:center;color:#fff;width:100%;max-width:320px}
.celebrate .flame-svg.big{width:150px;height:190px;filter:drop-shadow(0 0 24px rgba(255,46,147,.6))}
.celebrate.on .flame-svg.big{animation:rise 1.4s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{0%{transform:scale(.2) translateY(60px);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.celebrate .flame-svg .flick{animation:flick 1.2s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.06) skewX(2deg)}}
.cel-num{font-size:64px;font-weight:900;line-height:1}.cel-num.pop{animation:bump .6s}.cel-lbl{opacity:.9;font-size:17px;margin:6px 0 18px}
.bigstep{display:flex;align-items:center;justify-content:center;gap:22px;margin:14px 0 4px}.bigstep b{font-size:44px;min-width:60px;text-align:center}
.bigstep .st-btn{width:64px;height:64px}
.strip{scroll-snap-type:none;position:relative}
.rowbtn{width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.pill{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
